<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('counsel-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta)
            meta.setAttribute(
              'content',
              theme === 'dark' ? '#0f1218' : '#f7f8fa',
            );
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="A considered workspace for your firm's time. Track client work, understand billability, and make every hour count."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Counsel — Time, well accounted for.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
